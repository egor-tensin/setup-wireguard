name: Test

on:
  push:
    paths-ignore:
      - '**.md'
  schedule:
    # Weekly, at 00:30 UTC on Friday (somewhat randomly chosen).
    - cron: '30 00 * * 5'
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up WireGuard
        uses: $/
        with:
          endpoint: ${{ secrets.ENDPOINT }}
          endpoint_public_key: ${{ secrets.ENDPOINT_PUBLIC }}
          ips: ${{ secrets.IPS }}
          allowed_ips: ${{ secrets.ALLOWED_IPS }}
          private_key: ${{ secrets.PRIVATE }}
          preshared_key: ${{ secrets.PRESHARED }}
          keepalive: 25
      - name: Check endpoint
        env:
          PRIVATE_IP: ${{ secrets.ENDPOINT_PRIVATE_IP }}
        run: |
          ping -W 10 -c 5 -- "$PRIVATE_IP"

  release:
    if: github.ref_type == 'tag'
    name: Release
    runs-on: ubuntu-latest
    needs:
      - test
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Release
        uses: softprops/action-gh-release@v3
